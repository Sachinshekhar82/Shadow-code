rules:
  - id: python-command-injection-shell-true
    patterns:
      - pattern-either:
          - pattern: subprocess.$METHOD(..., shell=True, ...)
          - pattern: os.system(...)
          - pattern: os.popen(...)
    message: "Potential Command Injection: User input executed in a shell environment without sanitization."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021-Injection"
      confidence: HIGH

  - id: python-sql-injection-string-concat
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute(f"..." % ...)
          - pattern: $CURSOR.execute(f"...{$VAR}...")
          - pattern: $CURSOR.execute("..." + $VAR)
          - pattern: $CURSOR.execute("...".format($VAR))
    message: "Potential SQL Injection: Dynamic SQL query constructed via string concatenation/formatting."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: "A03:2021-Injection"
      confidence: HIGH

  - id: python-insecure-deserialization-pickle
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: _pickle.loads(...)
    message: "Insecure Deserialization: Untrusted data loaded with pickle can execute arbitrary code."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021-Software and Data Integrity Failures"
      confidence: HIGH

  - id: python-hardcoded-secret-key
    patterns:
      - pattern-either:
          - pattern: $KEY = "..."
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)(api_key|secret_key|jwt_secret|private_key|auth_token)
      - metavariable-regex:
          metavariable: "..."
          regex: "^[A-Za-z0-9_\\-\\.\\/+=]{12,}$"
    message: "Hardcoded Credential: A secret or API token appears directly committed to source code."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021-Identification and Authentication Failures"
      confidence: MEDIUM

  - id: python-weak-cryptography-md5
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
    message: "Weak Cryptographic Hash: MD5 or SHA1 utilized. Use SHA-256 or bcrypt/argon2 for password hashing."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: HIGH

  - id: python-path-traversal-open
    patterns:
      - pattern: open($PATH, ...)
      - pattern-not: open("...", ...)
    message: "Potential Path Traversal: Dynamic file path accessed without validation."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: "A01:2021-Broken Access Control"
      confidence: MEDIUM
