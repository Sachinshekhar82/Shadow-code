version: "3.8"

services:
  shadow-code:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shadow-code-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=shadow_code
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-Sachinshekhar82/Shadow-code}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-shadow-code-webhook-secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - LLM_PROVIDER=gemini
    depends_on:
      - mongodb
    networks:
      - shadow-network

  mongodb:
    image: mongo:7.0
    container_name: shadow-code-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - shadow-network

networks:
  shadow-network:
    driver: bridge

volumes:
  mongodb_data:
